name: Linux compiler qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-qualification-${{ github.ref }}
  # Preserve long main-branch toolchain builds so they can finish and cache.
  # Pull requests may cancel superseded work; older pending main runs may be replaced.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CC: clang
      CXX: clang++
      LLVM_BUILD: build/llvm
      LLVM_TARGETS: X86;AArch64
      LLVM_ENABLE_PROJECTS: 'lld;clang'
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Run VS Code definition decoder regressions
        run: npm --prefix vscode-stasha test
      - name: Install official Ubuntu build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang lld cmake ninja-build python3 binutils libzstd-dev zlib1g-dev
      - name: Run frontend and oracle regressions
        run: |
          bash scripts/test_harness_selftest.sh
          bash scripts/test_frontend.sh
      - name: Fingerprint exact toolchain inputs
        id: inputs
        run: python3 scripts/toolchain_fingerprint.py --github-output --output build/toolchain-inputs.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: llvm-cache
        with:
          path: build/llvm
          key: llvm-qualification-v2-${{ steps.inputs.outputs.key }}
      - name: Build pinned LLVM and LLD
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: make llvm LLVM_BUILD_JOBS=2 LLVM_LINK_JOBS=1
      - name: Ensure pinned Clang and resource headers
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        # Cache misses need Clang; every run verifies the pinned toolchain below.
        run: |
          cmake -S extlib/llvm/llvm -B "$LLVM_BUILD" -DLLVM_ENABLE_PROJECTS="$LLVM_ENABLE_PROJECTS" -DLLVM_APPEND_VC_REV=ON -DLLVM_PARALLEL_LINK_JOBS=1
          cmake --build "$LLVM_BUILD" --target clang --parallel 2
      - name: Verify pinned source and build identity
        run: python3 scripts/verify_llvm_toolchain.py --llvm-build "$LLVM_BUILD" --require-clang --output build/qualification/toolchain.json
      - name: Build compiler
        run: make -j2 STASHA_NO_OPENSSL=1 all tests/cinterop/build/libcinterop_support.a
      - name: Run strict hosted compiler qualification
        run: bash scripts/qualify_linux.sh ./bin/stasha build/qualification
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-compiler-qualification-${{ github.sha }}
          path: build/qualification/
          if-no-files-found: error
          retention-days: 7
