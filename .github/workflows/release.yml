name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-14
            os_name: macos
            arch: arm64
            archive_ext: tar.gz

          - target: macos-x86_64
            runner: macos-13
            os_name: macos
            arch: x86_64
            archive_ext: tar.gz

          - target: linux-x86_64
            runner: ubuntu-latest
            os_name: linux
            arch: x86_64
            archive_ext: tar.gz

          - target: linux-arm64
            runner: ubuntu-24.04-arm
            os_name: linux
            arch: arm64
            archive_ext: tar.gz

          - target: windows-x86_64
            runner: windows-latest
            os_name: windows
            arch: x86_64
            archive_ext: zip

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── dependency setup (non-Windows) ──────────────────────────
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build clang lld

      # ── LLVM cache ──────────────────────────────────────────────
      - name: Cache LLVM build
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        id: llvm-cache
        with:
          path: build/llvm
          key: llvm-${{ matrix.target }}-${{ hashFiles('extlib/llvm/**') }}

      - name: Build LLVM (non-Windows)
        if: runner.os != 'Windows' && steps.llvm-cache.outputs.cache-hit != 'true'
        run: make llvm

      # ── OpenSSL cache (non-Windows) ──────────────────────────────
      - name: Cache OpenSSL build
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        id: openssl-cache
        with:
          path: build/openssl
          key: openssl-${{ matrix.target }}-${{ hashFiles('extlib/openssl/**') }}

      - name: Build OpenSSL (non-Windows)
        if: runner.os != 'Windows' && steps.openssl-cache.outputs.cache-hit != 'true'
        run: make openssl

      # ── Windows: MSYS2 UCRT64 toolchain (clang + llvm + lld + make) ───
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            make

      # ── build compiler + stdlib ─────────────────────────────────
      - name: Build stasha (non-Windows)
        if: runner.os != 'Windows'
        run: |
          make
          make stdlib

      - name: Build stasha (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          LLVM_BUILD: /ucrt64
          STASHA_NO_OPENSSL: "1"
        run: |
          make
          make stdlib

      # ── upload build dir on failure for debugging ────────────────
      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}-failure
          path: |
            build/
            bin/
          retention-days: 3

      # ── package (flat layout: everything under bin/) ─────────────
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          ARCHIVE="stasha-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz"
          mkdir -p _dist/bin/stdlib
          cp bin/stasha _dist/bin/
          cp bin/thread_runtime.a bin/zone_runtime.a \
             bin/coro_runtime.a bin/crash_runtime.a _dist/bin/
          cp -r bin/stdlib/. _dist/bin/stdlib/
          tar -czf "$ARCHIVE" -C _dist .
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Archive = "stasha-windows-x86_64.zip"
          New-Item -ItemType Directory -Force _dist\bin\stdlib | Out-Null
          Copy-Item bin\stasha.exe _dist\bin\
          Copy-Item bin\thread_runtime.a, bin\zone_runtime.a, `
                    bin\coro_runtime.a, bin\crash_runtime.a _dist\bin\
          Copy-Item -Recurse bin\stdlib\* _dist\bin\stdlib\
          Compress-Archive -Path _dist\* -DestinationPath $Archive -Force
          $hash = (Get-FileHash $Archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $Archive" | Out-File -FilePath "$Archive.sha256" -Encoding utf8 -NoNewline
          echo "ARCHIVE=$Archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # ── upload to GitHub Release ─────────────────────────────────
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
